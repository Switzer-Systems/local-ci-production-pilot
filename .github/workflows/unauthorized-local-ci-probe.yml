name: Unauthorized Local CI Production Pilot Probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  unauthorized-local-ci-probe:
    runs-on:
      group: local-ci-production-pilot
      labels: [self-hosted, Linux, ARM64, local-ci-production-pilot]
    permissions: {}
    steps:
      - name: Fail if the production-pilot runner is acquired
        shell: bash
        run: |
          echo 'SECURITY FAILURE: unauthorized workflow acquired production-pilot runner'
          exit 97
